# Secret Scanning via Gitleaks — deliberately NOT relying on GitHub's native
# secret scanning toggle, because that one is only free while this repo
# stays public; flip it to private later and it silently requires a paid
# GitHub Secret Protection license. This workflow keeps working either way.
#
# gitleaks-action is free with just GITHUB_TOKEN for any repo owned by a
# personal account (this one). A GITLEAKS_LICENSE secret is only required
# if the repo is ever transferred to an organization account — not a
# concern here, but noted in case that changes.
#
# Recommended alongside, not instead of, the free native toggle:
# Settings → Code security → Secret scanning + Push protection. That one
# also blocks a bad commit before it's even pushed (push protection runs
# client-side at push time); this one is the CI-level backstop that keeps
# working even if the repo's visibility or plan ever changes.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — gitleaks scans commits, not just the working tree

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # only needed if this repo ever moves to an org account