# Mutation Testing (Stryker) — scheduled, not per-PR.
#
# Mutation testing is slow (it reruns your test suite once per mutant), so
# it doesn't belong in ci.yml where it would add minutes to every push.
# Same pattern as codeql.yml's weekly cron — runs on its own schedule and
# publishes the report as a build artifact instead of a file committed to
# the repo.
#
# Recommended companion change: remove reports/mutation/mutation.html from
# git and add `reports/` to .gitignore. A generated HTML report doesn't
# need to live in version control — this workflow regenerates a fresh one
# every week and attaches it to the run, so the committed copy just goes
# stale and bloats the repo otherwise.
name: Mutation Testing

on:
  schedule:
    # Weekly, Wednesday 04:00 UTC — offset from CodeQL's Tuesday 04:25 UTC
    # cron so the two scheduled jobs don't compete for runner availability.
    - cron: '0 4 * * 3'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

permissions:
  contents: read

jobs:
  mutation:
    name: Stryker Mutation Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Stryker
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30